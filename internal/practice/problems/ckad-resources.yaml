id: ckad-resources
exam: CKAD
domain: アプリの環境・設定・セキュリティ
title: ResourceQuota のある Namespace で Pod を動かす
weight: 5
namespaces: [limits]
setup: |
  apiVersion: v1
  kind: Namespace
  metadata:
    name: limits
  ---
  apiVersion: v1
  kind: ResourceQuota
  metadata:
    name: team-quota
    namespace: limits
  spec:
    hard:
      requests.cpu: "1"
      requests.memory: 1Gi
      limits.cpu: "2"
      limits.memory: 2Gi
task: |
  Namespace limits には ResourceQuota team-quota があり、requests と limits を書かない Pod は作れません。
  この Namespace に Pod calc を作ってください。

  - イメージ: registry.k8s.io/e2e-test-images/agnhost:2.39、引数: netexec --http-port=8080
  - requests: CPU 100m、メモリ 64Mi
  - limits: CPU 200m、メモリ 128Mi

  Pod が Running で Ready になっていること。
checks:
  - description: requests の CPU が 100m
    apiVersion: v1
    kind: Pod
    namespace: limits
    name: calc
    jsonpath: '{.spec.containers[0].resources.requests.cpu}'
    equals: 100m
  - description: requests のメモリが 64Mi
    apiVersion: v1
    kind: Pod
    namespace: limits
    name: calc
    jsonpath: '{.spec.containers[0].resources.requests.memory}'
    equals: 64Mi
  - description: limits の CPU が 200m
    apiVersion: v1
    kind: Pod
    namespace: limits
    name: calc
    jsonpath: '{.spec.containers[0].resources.limits.cpu}'
    equals: 200m
  - description: limits のメモリが 128Mi
    apiVersion: v1
    kind: Pod
    namespace: limits
    name: calc
    jsonpath: '{.spec.containers[0].resources.limits.memory}'
    equals: 128Mi
  - description: Pod が Ready
    apiVersion: v1
    kind: Pod
    namespace: limits
    name: calc
    jsonpath: '{.status.conditions[?(@.type=="Ready")].status}'
    equals: "True"
hint: |
  まず kubectl -n limits describe resourcequota team-quota で制限を確かめます。
  kubectl run は requests / limits を指定できないので、--dry-run=client -o yaml の下書きに resources を書き足します。
solution: |
  Pod の下書きの containers に次を足して kubectl apply -f します。

    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  requests はスケジュールのときの予約 (このノードに置けるか)、limits は使える上限です。
  メモリが limits を超えると OOMKilled で止められ、CPU は limits で絞られます。
  ResourceQuota が requests.cpu などを制限している Namespace では、それを書かない Pod は作成の時点で拒否されます。
  kubectl -n limits describe resourcequota team-quota で、Used が増えたことを確かめられます。
answer: |
  apiVersion: v1
  kind: Pod
  metadata:
    name: calc
    namespace: limits
  spec:
    containers:
      - name: calc
        image: registry.k8s.io/e2e-test-images/agnhost:2.39
        args: ["netexec", "--http-port=8080"]
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
