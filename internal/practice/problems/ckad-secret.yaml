id: ckad-secret
exam: CKAD
domain: アプリの環境・設定・セキュリティ
title: Secret をファイルと環境変数で Pod に渡す
weight: 6
namespaces: [vault]
setup: |
  apiVersion: v1
  kind: Namespace
  metadata:
    name: vault
task: |
  Namespace vault で次の 2 つを作ってください。

  1. Secret db-cred (種類は generic)。キー username に admin、キー password に s3cr3t を入れる
  2. Pod app
     - イメージ: registry.k8s.io/e2e-test-images/agnhost:2.39、引数: netexec --http-port=8080
     - Secret db-cred を、ディレクトリ /etc/db に読み取り専用でマウントする
     - 環境変数 DB_USER に、Secret db-cred のキー username の値を入れる

  Pod が Running で Ready になっていること。
checks:
  - description: Secret db-cred の username が admin
    apiVersion: v1
    kind: Secret
    namespace: vault
    name: db-cred
    jsonpath: '{.data.username}'
    equals: YWRtaW4=
  - description: Secret db-cred の password が s3cr3t
    apiVersion: v1
    kind: Secret
    namespace: vault
    name: db-cred
    jsonpath: '{.data.password}'
    equals: czNjcjN0
  - description: Secret db-cred をボリュームにしている
    apiVersion: v1
    kind: Pod
    namespace: vault
    name: app
    jsonpath: '{.spec.volumes[?(@.secret.secretName=="db-cred")].name}'
    exists: true
  - description: /etc/db にマウントしている
    apiVersion: v1
    kind: Pod
    namespace: vault
    name: app
    jsonpath: '{.spec.containers[0].volumeMounts[?(@.mountPath=="/etc/db")].name}'
    exists: true
  - description: マウントが読み取り専用
    apiVersion: v1
    kind: Pod
    namespace: vault
    name: app
    jsonpath: '{.spec.containers[0].volumeMounts[?(@.mountPath=="/etc/db")].readOnly}'
    equals: "true"
  - description: 環境変数 DB_USER が Secret db-cred の username を参照している
    apiVersion: v1
    kind: Pod
    namespace: vault
    name: app
    jsonpath: '{.spec.containers[0].env[?(@.name=="DB_USER")].valueFrom.secretKeyRef.name}/{.spec.containers[0].env[?(@.name=="DB_USER")].valueFrom.secretKeyRef.key}'
    equals: db-cred/username
  - description: Pod が Ready
    apiVersion: v1
    kind: Pod
    namespace: vault
    name: app
    jsonpath: '{.status.conditions[?(@.type=="Ready")].status}'
    equals: "True"
hint: |
  Secret は kubectl create secret generic で、--from-literal を 2 つ並べて作れます。
  Pod は kubectl run ... --dry-run=client -o yaml で下書きを作り、volumes・volumeMounts・env を書き足します。
solution: |
  kubectl -n vault create secret generic db-cred --from-literal=username=admin --from-literal=password=s3cr3t

  Pod の下書きに次を足して kubectl apply -f します。

    spec:
      containers:
        - name: app
          ...
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-cred
                  key: username
          volumeMounts:
            - name: cred
              mountPath: /etc/db
              readOnly: true
      volumes:
        - name: cred
          secret:
            secretName: db-cred

  マウントすると、キーごとにファイルができます (/etc/db/username と /etc/db/password)。
  kubectl -n vault exec app -- cat /etc/db/password で確かめられます。
  Secret の data は base64 で、暗号化ではありません。kubectl get secret db-cred -o jsonpath='{.data.password}' | base64 -d で読めます。
answer: |
  apiVersion: v1
  kind: Secret
  metadata:
    name: db-cred
    namespace: vault
  type: Opaque
  data:
    username: YWRtaW4=
    password: czNjcjN0
  ---
  apiVersion: v1
  kind: Pod
  metadata:
    name: app
    namespace: vault
  spec:
    containers:
      - name: app
        image: registry.k8s.io/e2e-test-images/agnhost:2.39
        args: ["netexec", "--http-port=8080"]
        env:
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: db-cred
                key: username
        volumeMounts:
          - name: cred
            mountPath: /etc/db
            readOnly: true
    volumes:
      - name: cred
        secret:
          secretName: db-cred
