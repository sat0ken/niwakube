name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet / gofmt
        run: make vet
      - name: go test
        run: make test
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh installer/*.sh

  build:
    needs: test
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe でバージョンを付けるため
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          make build BIN=dist/niwakubed-linux-${{ matrix.goarch }}
          file dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: niwakubed-linux-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum niwakubed-* > SHA256SUMS
          # niwakubed と SHA256SUMS だけを載せる (make build が作るテスト用の termcheck は載せない)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes niwakubed-* SHA256SUMS
