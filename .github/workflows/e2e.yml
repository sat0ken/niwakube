# GitHub Actions のランナー上で /dev/kvm を使い、実際に Cloud Hypervisor で VM を起動して確かめる。
# ランナー自体が VM なので、その中でさらに VM を動かす nested virtualization になる。
name: E2E (KVM)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vm:
    name: VM
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Host setup
        run: ./scripts/ci-host-setup.sh
      - name: Boot a VM with test-vm.sh
        run: sudo MEM=2G BOOT_TIMEOUT=300 ./scripts/test-vm.sh up ci
      - name: Delete the test VM
        if: always()
        run: sudo ./scripts/test-vm.sh down ci || true
      - name: niwakubed E2E (VM)
        run: make e2e
      - name: Collect logs
        if: failure()
        run: ./scripts/ci-collect-logs.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs-vm
          path: e2e-logs/

  cluster:
    name: Cluster (${{ matrix.distro }})
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        distro: [k3s, kubeadm]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Host setup
        run: ./scripts/ci-host-setup.sh
      - name: niwakubed E2E (cluster)
        run: make e2e-cluster DISTRO=${{ matrix.distro }}
      - name: Collect logs
        if: failure()
        run: ./scripts/ci-collect-logs.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs-${{ matrix.distro }}
          path: e2e-logs/
