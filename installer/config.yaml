# niwakube のホストを自動インストールする ISO の設定。
# このファイルを変更して PR を出すと、GitHub Actions が ISO を作り、VM で実際にインストールを試してから
# Artifacts (niwakube-installer) に置く。手順は docs/installer.md を参照。

hostname: niwak8s
timezone: Asia/Tokyo
keyboard: jp

user:
  name: sat0ken
  github_keys: sat0ken          # GitHub に登録した公開鍵を取り込む (パスワードではログインできない)
  # ssh_authorized_keys:        # 鍵を直接書くこともできる
  #   - ssh-ed25519 AAAA...

# network を書かなければ DHCP
network:
  address: 192.168.1.50/24
  gateway: 192.168.1.1
  dns: [192.168.1.1]

storage:
  disk:                         # 無人インストールでは {model: "..."} か {serial: "..."} が必須
    model: "Samsung SSD 860"    # lsblk の MODEL のとおり (SATA は 16 文字で切れるので "EVO" は入らない)
  root_size: 50G                # 残りはすべて /var/lib/niwakube (XFS)

install:
  mode: unattended              # confirm: 消去の前に確認する / unattended: 確認なし (GRUB の既定の項目)
  after: poweroff               # インストール後は電源を切る (USB を抜いてから起動する)
  # Server ISO (約 3GB) を取るミラー。止まったら releases.ubuntu.com と交互に試す。中身は SHA256 で確かめる
  # 他の例: https://ftp.riken.jp/Linux/ubuntu-releases、https://ftp.yz.yamagata-u.ac.jp/pub/linux/ubuntu-releases
  iso_mirror: https://ftp.jaist.ac.jp/pub/Linux/ubuntu-releases

niwakube:
  setup: true                   # 初回起動時に host-setup.sh を実行する
  ref: v0.1.0                   # v* のタグにすると niwakubed もリリースから入れる
